name: Deploy Mobile Repair Shop (CloudFormation + GitHub Actions)

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  STACK_NAME: mobile-repair-stack

jobs:
  # ─────────────────────────────────────────
  # JOB 1: Build the React frontend
  # ─────────────────────────────────────────
  build:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install & Build Frontend
        env:
          VITE_API_URL: /api
        run: |
          cd frontend
          npm ci
          npm run build

  # ─────────────────────────────────────────
  # JOB 2: Deploy to AWS EC2 via CloudFormation
  # ─────────────────────────────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy CloudFormation Stack (Create or Update EC2)
        run: |
          aws cloudformation deploy \
            --stack-name ${{ env.STACK_NAME }} \
            --template-file infra/ec2-instance.yaml \
            --parameter-overrides InstanceType=t2.micro \
            --no-fail-on-empty-changeset \
            --region ${{ env.AWS_REGION }}

      - name: Get EC2 Public IP from CloudFormation Output
        id: get-ip
        run: |
          IP=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.STACK_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --query "Stacks[0].Outputs[?OutputKey=='PublicIP'].OutputValue" \
            --output text)
          echo "EC2_IP=$IP" >> $GITHUB_OUTPUT
          echo "Server IP: $IP"

      - name: Retrieve SSH Key from SSM Parameter Store
        id: get-key
        run: |
          SSM_PATH=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.STACK_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --query "Stacks[0].Outputs[?OutputKey=='SSMKeyPath'].OutputValue" \
            --output text)
          aws ssm get-parameter \
            --name "$SSM_PATH" \
            --with-decryption \
            --region ${{ env.AWS_REGION }} \
            --query "Parameter.Value" \
            --output text > /tmp/server-key.pem
          chmod 600 /tmp/server-key.pem

      - name: Wait for SSH to Become Available
        run: |
          IP=${{ steps.get-ip.outputs.EC2_IP }}
          for i in $(seq 1 36); do
            if nc -zw5 "$IP" 22 2>/dev/null; then
              echo "SSH is ready on $IP"
              exit 0
            fi
            echo "Waiting for SSH... ($i/36)"
            sleep 10
          done
          echo "SSH never became available. Exiting."
          exit 1

      - name: Deploy Code & Restart Services via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          EC2_IP: ${{ steps.get-ip.outputs.EC2_IP }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ADMIN_NAME: ${{ secrets.ADMIN_NAME }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        with:
          host: ${{ steps.get-ip.outputs.EC2_IP }}
          username: ubuntu
          key_path: /tmp/server-key.pem
          script_stop: true
          envs: EC2_IP,MONGODB_URI,JWT_SECRET,ADMIN_NAME,ADMIN_EMAIL,ADMIN_PASSWORD
          script: |
            echo ">>> [1/6] Waiting for cloud-init bootstrap to finish..."
            sudo cloud-init status --wait || true

            echo ">>> [2/6] Pulling latest code from GitHub..."
            cd /var/www/app
            git fetch origin main
            git reset --hard origin/main

            echo ">>> [3/6] Installing backend dependencies..."
            cd /var/www/app/backend
            npm ci --omit=dev

            echo ">>> [4/6] Writing backend .env from GitHub Secrets..."
            printf "%s\n" \
              "PORT=5000" \
              "NODE_ENV=production" \
              "MONGODB_URI=$MONGODB_URI" \
              "JWT_SECRET=$JWT_SECRET" \
              "JWT_EXPIRES_IN=7d" \
              "ADMIN_NAME=$ADMIN_NAME" \
              "ADMIN_EMAIL=$ADMIN_EMAIL" \
              "ADMIN_PASSWORD=$ADMIN_PASSWORD" \
              "CORS_ORIGINS=http://$EC2_IP" \
              > /var/www/app/backend/.env

            echo ">>> [5/6] Building React frontend..."
            cd /var/www/app/frontend
            npm ci
            VITE_API_URL=/api npm run build

            echo ">>> [6/6] Reloading PM2 and Nginx..."
            cd /var/www/app/backend
            pm2 delete all 2>/dev/null || true
            pm2 start ecosystem.config.cjs --update-env
            pm2 save
            sudo cp /var/www/app/infra/nginx.conf /etc/nginx/sites-available/app
            sudo nginx -t && sudo systemctl reload nginx

      - name: Print Live Website URL
        run: echo "Website is live at http://${{ steps.get-ip.outputs.EC2_IP }}"

      - name: Clean Up Temporary SSH Key
        if: always()
        run: rm -f /tmp/server-key.pem
